<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Tax Doctor - AamirTechs</title>
<style>
:root{--navy:#0b1f3a;--gold:#d4a72c;--bg:#f6f8fb;--ink:#1c2733;--muted:#5b6b7c;--line:#d9e1ea}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:28px 20px;border-bottom:4px solid var(--gold)}
header .wrap{max-width:880px;margin:0 auto}
header h1{margin:0 0 6px;font-size:1.6rem}
header p{margin:0;color:#c8d4e4}
main{max-width:880px;margin:24px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(11,31,58,.08)}
label{display:block;font-weight:600;margin:14px 0 6px}
.card>label:first-child{margin-top:0}
textarea{width:100%;min-height:180px;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem}
textarea.small{min-height:110px}
input[type=text],input[type=number],select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:.95rem;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:4px}
.grid label{margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:.95rem;cursor:pointer}
button.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.gold{background:var(--gold);color:#0b1f3a;font-weight:600}
pre{background:#0b1f3a;color:#eef3f9;border-radius:8px;padding:16px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;min-height:60px;font-size:.85rem}
footer{max-width:880px;margin:0 auto 32px;padding:0 20px;color:var(--muted);font-size:.9rem}
footer a{color:var(--navy)}
.hint{color:var(--muted);font-size:.85rem;margin-top:6px;font-weight:400}
</style>
</head>
<body>
<header><div class="wrap"><h1>Fuel Tax Doctor</h1><p>Audit a quarterly IFTA fuel tax records CSV export for audit triggers before the return goes in.</p></div></header>
<main><div class="card">
<label for="file">Input CSV file</label>
<input type="file" id="file" accept=".csv,text/csv">
<label for="input">Or paste the fuel tax records CSV</label>
<textarea id="input" spellcheck="false" placeholder="Paste an IFTA fuel tax records CSV here, or load the sample."></textarea>
<label for="rates-file">Tax rates CSV file <span class="hint">(--rates-file, optional)</span></label>
<input type="file" id="rates-file" accept=".csv,text/csv">
<label for="rates">Or paste the tax rates CSV <span class="hint">(jurisdiction,rate; leave blank to skip net tax)</span></label>
<textarea id="rates" class="small" spellcheck="false" placeholder="jurisdiction,rate"></textarea>
<label>Options</label>
<div class="grid">
<div><label for="opt-minmpg">Min MPG <span class="hint">(--min-mpg)</span></label><input type="number" id="opt-minmpg" step="any" value="4"></div>
<div><label for="opt-maxmpg">Max MPG <span class="hint">(--max-mpg)</span></label><input type="number" id="opt-maxmpg" step="any" value="8"></div>
<div><label for="opt-total">Total miles <span class="hint">(--total-miles, blank means none)</span></label><input type="number" id="opt-total" step="any" placeholder="none"></div>
<div><label for="opt-asof">As of date <span class="hint">(--as-of, blank means today)</span></label><input type="text" id="opt-asof" placeholder="2026-11-18"></div>
</div>
<div class="row"><button class="gold" id="run" type="button">Run check</button><button class="alt" id="sample" type="button">Load sample</button><button class="alt" id="download" type="button">Download report</button></div>
<label for="out">Report</label>
<pre id="out">Your report will appear here.</pre>
</div></main>
<footer>
<p>Built by AamirTechs. <a href="https://aamirtechs.github.io/">All tools</a> | <a href="https://github.com/aamirtechs/fuel-tax-doctor">Source</a></p>
<p>Privacy: this tool runs 100% in your browser, nothing is uploaded.</p>
</footer>

    }

  records.forEach(function (row) {

    var entry = grouped[key];

        taxPaid: Dec(0), taxable: null, netGallons: null, rate: row.rate, netTax: null };
      groupOrder.push(entry);

    if (row.miles !== null) entry.miles = decAdd(entry.miles, row.miles);
    if (row.gallons !== null) entry.gallons = decAdd(entry.gallons, row.gallons);
    if (row.taxPaid !== null) entry.taxPaid = decAdd(entry.taxPaid, row.taxPaid);
    if (row.taxableGallons !== null) entry.taxable = decAdd(entry.taxable || Dec(0), row.taxableGallons);
    if (row.netGallons !== null) entry.netGallons = decAdd(entry.netGallons || Dec(0), row.netGallons);

    ", total taxable gallons: " + fmtDecimal(sumField(records, "taxableGallons")) +
    ", total net gallons: " + fmtDecimal(sumField(records, "netGallons")));
  lines.push("Total net tax: " + fmtMoney(totalNetTax) + ", total credits: " + fmtMoney(totalCredits));

    " " + padLeft("tax-paid", 11) + " " + padLeft("taxable", 11) + " " + padLeft("net gal", 11) +
    " " + padLeft("rate", 7) + " " + padLeft("net tax", 11));
  groupOrder.forEach(function (entry) {
    lines.push(padRight(entry.jurisdiction, 13) + " " + padLeft(fmtDecimal(entry.miles), 11) +
      " " + padLeft(fmtDecimal(entry.gallons), 11) + " " + padLeft(fmtDecimal(entry.taxPaid), 11) +
      " " + padLeft(fmtDecimal(entry.taxable), 11) + " " + padLeft(fmtDecimal(entry.netGallons), 11) +
      " " + padLeft(entry.rate !== null ? fmtMoney(entry.rate) : "n/a", 7) +
      " " + padLeft(fmtMoney(entry.netTax), 11));
